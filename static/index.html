<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
    <style>
        body {
            font-family: Arial;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .card {
            border: 1px solid #ddd;
            padding: 15px;
            flex: 1;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        td,
        th {
            border: 1px solid #ddd;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Mock URL Shortener</h1>

    <input id="url" placeholder="https://example.com">
    <input id="alias" placeholder="Custom alias (optional)">
    <input id="expiry" type="number" placeholder="Expires in minutes (optional)">

    <button onclick="shorten()">Shorten</button>

    <h3 id="result"></h3>

    <div class="stats">
        <div class="card">
            <h2 id="total">0</h2>
            Total URLs
        </div>

        <div class="card">
            <h2 id="clicks">0</h2>
            Total Clicks
        </div>

        <div class="card">
            <h2 id="active">0</h2>
            Active URLs
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Code</th>
                <th>Clicks</th>
                <th>Created</th>
            </tr>
        </thead>
        <tbody id="table"></tbody>
    </table>

    <script>
        async function shorten() {

            const body = {
                url: document.getElementById('url').value
            }

            const alias = document.getElementById('alias').value;
            const expiry = document.getElementById('expiry').value;

            if (alias) body.alias = alias;
            if (expiry) body.expiresInMinutes = parseInt(expiry);

            const res = await fetch('/api/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await res.json();

            if (data.error) {
                result.innerText = data.error;
                return;
            }

            result.innerHTML = `<a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>`;

            loadStats();
            loadUrls();
        }

        async function loadStats() {

            const res = await fetch('/api/stats');
            const data = await res.json();

            total.innerText = data.totalUrls;
            clicks.innerText = data.totalClicks;
            active.innerText = data.activeUrls;
        }

        async function loadUrls() {

            const res = await fetch('/api/urls');
            const data = await res.json();

            table.innerHTML = '';

            data.forEach(url => {
                table.innerHTML += `
    <tr>
      <td><a href="/${url.code}" target="_blank">${url.code}</a></td>
      <td>${url.clicks}</td>
      <td>${url.createdAt || '-'}</td>
    </tr>`;
            });
        }

        loadStats();
        loadUrls();
    </script>

</body>

</html>
